events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format custom '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log custom;
    error_log /var/log/nginx/error.log warn;

    limit_req_zone $binary_remote_addr zone=ip_limit:10m rate=30r/s;

    map $http_user_agent $ai_bot {
        default 0;
        ~*GPTBot 1;
        ~*ChatGPT-User 1;
        ~*ClaudeBot 1;
        ~*Claude-Web 1;
        ~*AnthropicAI 1;
        ~*PerplexityBot 1;
        ~*CCBot 1;
        ~*Bytespider 1;
        ~*Google-Extended 1;
    }

    server {
        listen 80;
        server_name localhost;

        if ($ai_bot = 1) {
            return 403 "Access Denied: AI Scrapers and Bots are strictly prohibited.";
        }

        limit_req zone=ip_limit burst=20 nodelay;

        location /api/ {
            proxy_pass http://bff-gateway:8080/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        location /documentation {
            proxy_pass http://bff-gateway:8080/documentation;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /robots.txt {
            proxy_pass http://frontend:3000/robots.txt;
        }

        location /llms.txt {
            proxy_pass http://frontend:3000/llms.txt;
        }

        location /sitemap.xml {
            proxy_pass http://frontend:3000/sitemap.xml;
        }

        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
