[databases]
quintadinha = host=postgres-primary port=5432 dbname=quintadinha user=quintadinha password=quintadinha_pass

[pgbouncer]
listen_addr = *
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
admin_users = quintadinha
stats_users = stats
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 5
