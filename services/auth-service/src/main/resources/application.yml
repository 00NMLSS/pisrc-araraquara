server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:pgbouncer}:${POSTGRES_PORT:6432}/${POSTGRES_DB:quintadinha}
    username: ${POSTGRES_USER:quintadinha}
    password: ${POSTGRES_PASSWORD:quintadinha_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

jwt:
  expiration: 900000
  refresh-expiration: 2592000000
