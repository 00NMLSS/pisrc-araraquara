server:
  port: 8082

spring:
  application:
    name: catalog-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:pgbouncer}:${POSTGRES_PORT:6432}/${POSTGRES_DB:quintadinha}
    username: ${POSTGRES_USER:quintadinha}
    password: ${POSTGRES_PASSWORD:quintadinha_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
